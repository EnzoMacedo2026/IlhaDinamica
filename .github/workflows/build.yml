name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Descompactar o zip do projeto
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -print -quit)
          if [ -n "$ZIP" ]; then
            echo "Descompactando $ZIP"
            unzip -q -o "$ZIP" -d projeto
          else
            echo "Nenhum zip encontrado, usando os arquivos do repositório"
          fi

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK de debug
        run: |
          set -e
          SETTINGS=$(find . -maxdepth 4 -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle não encontrado. Arquivos do repositório:"
            ls -la
            exit 1
          fi
          ROOT="$(cd "$(dirname "$SETTINGS")" && pwd)"
          echo "Projeto em: $ROOT"
          cd "$ROOT"
          if [ ! -f gradlew ]; then
            echo "gradlew ausente, gerando um novo"
            mkdir /tmp/wrap && cd /tmp/wrap
            gradle wrapper --gradle-version 8.14.3
            cp -r gradlew gradlew.bat gradle "$ROOT"/
            cd "$ROOT"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      
          - name: Enviar o APK
                  uses: actions/upload-artifact@v4
                  with:
                  name: APK-IlhaDinamica
                   path: app/build/outputs/apk/debug/app-debug.apk
                   if-no-files-found: error

