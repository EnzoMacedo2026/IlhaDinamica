name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O Android SDK já vem instalado no ubuntu-latest; só aceitamos as licenças
      # e garantimos a plataforma 36.
      - name: Preparar o Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar o APK de debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: IlhaDinamica-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
