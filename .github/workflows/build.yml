
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Dar permissão ao Gradle
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f ./gradle/wrapper/gradle-wrapper.properties ]; then
            gradle assembleDebug --stacktrace
          else
            echo "ERRO: Gradle Wrapper não encontrado."
            exit 1
          fi

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -name "*.apk" \
            -path "*/build/outputs/apk/*" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK encontrado: $APK"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: IlhaDinamica-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
