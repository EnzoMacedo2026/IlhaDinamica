
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f "IlhaDinamica.zip" ]; then
            echo "ERRO: IlhaDinamica.zip não encontrado na raiz."
            exit 1
          fi

          mkdir -p projeto
          unzip -oq IlhaDinamica.zip -d projeto

          echo "Conteúdo extraído:"
          find projeto -maxdepth 3 -type f | head -100

      - name: Localizar projeto Gradle
        shell: bash
        run: |
          set -e

          WRAPPER=$(find projeto -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não encontrado dentro do ZIP."
            echo "Verifique se o projeto contém o Gradle Wrapper."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36"

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: Nenhum APK foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: IlhaDinamica-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
